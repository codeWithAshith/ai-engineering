    "bedrock-agentcore>=1.22.0",
    "langchain>=1.3.6",
    "langchain-groq>=1.1.3",
    "langchain-openai>=0.3.0",
    "langchain-text-splitters>=1.1.2",
    "langchain-community>=0.3.0",
    "langgraph>=1.2.11",
    "nemoguardrails>=0.23.0",
    "numpy>=2.5.2",
    "openai>=1.70.0,<3.0.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "strands-agents>=1.53.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
